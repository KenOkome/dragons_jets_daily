name: 毎朝6時 ドラ＆ジェッツ速報自動更新

on:
  schedule:
    # 毎日 21:00 UTC (日本時間 午前6:00) に自動実行
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub画面から手動実行も可能

permissions:
  contents: write # リポジトリへのプッシュ権限

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ニュース取得＆AI要約・3日間レポート生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_news.py

      - name: 最新HTMLをGitHubにコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "変更はありませんでした。"
          else
            git commit -m "chore: 毎朝のドラ＆ジェッツ速報を自動更新 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
