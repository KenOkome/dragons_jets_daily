<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#131B2E"/>
    </linearGradient>
    <linearGradient id="dragonsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="jetsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>

  <!-- 左上: 野球ボール（ドラゴンズブルー） -->
  <g transform="translate(140, 190)">
    <circle r="90" fill="#FFFFFF"/>
    <circle r="90" fill="url(#dragonsGrad)" opacity="0.15"/>
    <circle r="90" fill="none" stroke="#1D4ED8" stroke-width="8"/>
    <!-- 縫い目 -->
    <path d="M-60,-65 C-30,-20 -30,20 -60,65" fill="none" stroke="#EF4444" stroke-width="6" stroke-dasharray="8 8"/>
    <path d="M60,-65 C30,-20 30,20 60,65" fill="none" stroke="#EF4444" stroke-width="6" stroke-dasharray="8 8"/>
    <!-- チームイニシャル D -->
    <text x="0" y="24" font-family="'Outfit', sans-serif" font-weight="900" font-size="70" fill="#1D4ED8" text-anchor="middle">D</text>
  </g>

  <!-- 右下: バスケットボール（ジェッツレッド） -->
  <g transform="translate(360, 310)">
    <circle r="95" fill="url(#jetsGrad)"/>
    <circle r="95" fill="none" stroke="#FFFFFF" stroke-width="7"/>
    <!-- バスケットボールライン -->
    <line x1="-95" y1="0" x2="95" y2="0" stroke="#FFFFFF" stroke-width="6"/>
    <line x1="0" y1="-95" x2="0" y2="95" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M-65,-65 C-15,-30 -15,30 -65,65" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <path d="M65,-65 C15,-30 15,30 65,65" fill="none" stroke="#FFFFFF" stroke-width="6"/>
    <!-- チームイニシャル J -->
    <text x="0" y="26" font-family="'Outfit', sans-serif" font-weight="900" font-size="75" fill="#FFFFFF" text-anchor="middle">J</text>
  </g>

  <!-- スパークル・星 -->
  <polygon points="256,120 262,138 280,144 262,150 256,168 250,150 232,144 250,138" fill="#FCD34D"/>
</svg>
